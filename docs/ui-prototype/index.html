<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeloRent – Dashboard UI Prototype</title>
<style>
:root{--bg:#0a0c10;--surface:#12151b;--surface2:#181c24;--border:#252a34;--text:#e9ecf2;--muted:#9aa3b2;--accent:#4d8dff;--accent-soft:rgba(77,141,255,.14);--ok:#5ed39a;--warn:#f2b94b;--err:#ff8a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #7db0ff;outline-offset:2px}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 0 248px;max-width:100%;width:248px;background:var(--surface);border-right:1px solid var(--border);padding:22px 16px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(180deg,#3a78ff,#2a5fe0);display:flex;align-items:center;justify-content:center}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-btn{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--muted);text-align:left;font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.on{background:linear-gradient(90deg,rgba(77,141,255,.2),rgba(77,141,255,.06));color:#b3d0ff;box-shadow:inset 3px 0 0 var(--accent)}
.side-note{margin-top:auto;padding:14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.main{flex:999 1 560px;min-width:0;padding:28px clamp(16px,3vw,36px) 40px;display:flex;flex-direction:column;gap:24px;background:radial-gradient(900px 320px at 75% -60px,rgba(47,107,255,.17),transparent 70%)}
.head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.head h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:12px}
.view{display:flex;flex-direction:column;gap:18px;animation:rise .3s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;transition:border-color .2s}
.card:hover{border-color:#2f3a52}
.pad{padding:20px}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.kpi{display:flex;flex-direction:column;gap:14px;padding:18px;background:linear-gradient(180deg,#161b25,#11141a)}
.kpi-ic{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,rgba(77,141,255,.32),rgba(77,141,255,.08));color:#a9ccff;display:flex;align-items:center;justify-content:center;border:1px solid rgba(77,141,255,.25)}
.kpi-val{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.p-ok{background:rgba(94,211,154,.12);color:#7fe0b0}
.p-info{background:var(--accent-soft);color:#9cc2ff}
.p-warn{background:rgba(242,185,75,.13);color:#f5c869}
.p-mute{background:rgba(154,163,178,.14);color:#c0c7d3}
.p-vip{background:#1f2f4d;color:#b7d1ff}
.p-reg{background:var(--surface2);color:#c0c7d3;border:1px solid var(--border)}
.scroll{overflow-x:auto}
.t{min-width:720px}
.row{display:grid;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--border);transition:background .15s}
.row:not(.hd):hover{background:#161b24}
.row.hd{border-top:0;padding-top:12px;padding-bottom:12px;color:var(--muted);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;background:var(--surface2);border-radius:14px 14px 0 0}
.c-fleet{grid-template-columns:minmax(190px,2fr) minmax(90px,1fr) minmax(130px,1.2fr) minmax(100px,1fr) minmax(110px,1fr)}
.c-book{grid-template-columns:50px minmax(170px,2fr) minmax(170px,2fr) 90px 70px 100px 120px 100px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;font-weight:500;color:var(--muted)}
.inp{height:44px;width:100%;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text)}
.inp::placeholder{color:#7d8696}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);font-weight:500;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:#36405a}
.btn.pri{background:linear-gradient(180deg,#3a78ff,#2a5fe0);border-color:#2f6bff;color:#fff}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg-b{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.seg-b:hover{color:var(--text)}
.seg-b.on{background:linear-gradient(180deg,#3a78ff,#2a5fe0);border-color:#2f6bff;color:#fff}
.av{width:34px;height:34px;border-radius:50%;background:#1f2f4d;color:#b7d1ff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex:none}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:16px}
.bars{display:flex;align-items:flex-end;gap:14px;height:200px;margin-top:18px;padding-top:8px;border-bottom:1px solid var(--border)}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.bar{width:100%;max-width:56px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#5b9bff,#2f6bff)}
.step{display:flex;gap:14px}
.step-l{display:flex;flex-direction:column;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);flex:none}
.dot.end{background:var(--accent)}
.stem{width:2px;flex:1;min-height:26px;background:#2b3446}
.empty{padding:32px 20px;text-align:center;border-top:1px solid var(--border);color:var(--muted)}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:0;width:min(480px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:16px}
.err{color:var(--err);font-size:13px;min-height:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2433;border:1px solid #33415c;color:var(--text);padding:12px 18px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:50;max-width:calc(100vw - 32px)}
.toast.bad{border-color:#7a3a3a;color:#ffb4b4}
.two{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
@media (max-width:820px){.nav{flex-direction:row;overflow-x:auto}.side-note{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l8 13 8-13"/></svg></div>
      <div><div style="font-size:17px;font-weight:700;letter-spacing:-.01em">VeloRent</div><div class="muted small">Rental management</div></div>
    </div>
    <nav class="nav" aria-label="Main">
      <button type="button" class="nav-btn" data-nav="dash"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
      <button type="button" class="nav-btn" data-nav="fleet"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l2-5.5A2 2 0 0 1 6.9 6h10.2A2 2 0 0 1 19 7.5L21 13"/><rect x="3" y="13" width="18" height="5" rx="1.5"/><circle cx="7.5" cy="18" r="1.5"/><circle cx="16.5" cy="18" r="1.5"/></svg>Fleet management</button>
      <button type="button" class="nav-btn" data-nav="book"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Bookings</button>
      <button type="button" class="nav-btn" data-nav="route"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8.2 18H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h5.8"/></svg>Route planner</button>
    </nav>
    <div class="side-note">
      <span class="small" style="font-weight:600;color:#9cc2ff">UI prototype</span>
      <span class="muted small">Data you enter is saved only in this browser. Not connected to the C++ backend.</span>
      <button type="button" class="btn sm" data-act="reset">Reset sample data</button>
    </div>
  </aside>
  <main class="main">
    <header class="head">
      <div><h1 id="title"></h1><p class="muted" id="subtitle"></p></div>
      <span class="pill p-warn"><i></i>Prototype · not connected to backend</span>
    </header>
    <div id="view"></div>
  </main>
</div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>

  var EDGES = [['Dehradun','Rishikesh'],['Rishikesh','Haridwar'],['Dehradun','Haridwar'],['Dehradun','Mussoorie'],['Haridwar','Roorkee'],['Roorkee','Delhi'],['Haridwar','Delhi'],['Dehradun','Chandigarh'],['Chandigarh','Delhi'],['Roorkee','Saharanpur'],['Saharanpur','Meerut'],['Meerut','Delhi'],['Saharanpur','Ambala'],['Ambala','Chandigarh'],['Ambala','Delhi'],['Delhi','Agra'],['Delhi','Jaipur'],['Agra','Jaipur'],['Haridwar','Haldwani'],['Haldwani','Nainital'],['Delhi','Haldwani']];
  var TYPES = ['Car', 'Electric', 'Bus', 'Bike'];
  var TYPE_NAMES = { Car: 'Cars', Electric: 'Electric vehicles', Bus: 'Luxury buses', Bike: 'Bikes' };
  var TITLES = {
    dash: ['Dashboard', 'Overview of the rental system'],
    fleet: ['Fleet management', 'Add, search, filter and sort vehicles'],
    book: ['Bookings', 'Create bookings, process them (VIP first) and view history'],

  };

  function sample() {

      fleet: [

        { vin: 'VIN1006', plate: 'DL03MN2211', name: 'Mahindra Thar', type: 'Car', rate: 3000, status: 'Available' },

        { vin: 'VIN1008', plate: 'UP14RS7788', name: 'Tata Harrier', type: 'Car', rate: 3400, status: 'Available' },

        { vin: 'VIN1012', plate: 'UK04ZA8844', name: 'Maruti Dzire', type: 'Car', rate: 1500, status: 'Available' },

        { vin: 'VIN2004', plate: 'DL05EV0310', name: 'Mahindra XUV400', type: 'Electric', rate: 2700, status: 'Available' },
        { vin: 'VIN2005', plate: 'HR26EV0512', name: 'BYD Atto 3', type: 'Electric', rate: 3600, status: 'Available' },
        { vin: 'VIN2006', plate: 'UK08EV0099', name: 'Tata Punch EV', type: 'Electric', rate: 2100, status: 'Available' },
        { vin: 'VIN2007', plate: 'DL06EV0777', name: 'Hyundai Kona EV', type: 'Electric', rate: 3300, status: 'Available' },
        { vin: 'VIN3002', plate: 'DL01BU1212', name: 'Mercedes Coach', type: 'Bus', rate: 12000, status: 'Available' },
        { vin: 'VIN3003', plate: 'UK07BU3434', name: 'Force Traveller', type: 'Bus', rate: 6000, status: 'Available' },
        { vin: 'VIN3004', plate: 'UP14BU5656', name: 'Tata Starbus', type: 'Bus', rate: 7500, status: 'Available' },
        { vin: 'VIN4003', plate: 'UK07BK3333', name: 'Bajaj Pulsar', type: 'Bike', rate: 600, status: 'Available' },
        { vin: 'VIN4004', plate: 'UK07BK4444', name: 'Honda Activa', type: 'Bike', rate: 450, status: 'Available' },
        { vin: 'VIN4005', plate: 'DL07BK5555', name: 'KTM Duke 390', type: 'Bike', rate: 1200, status: 'Available' },
        { vin: 'VIN4006', plate: 'UK08BK6666', name: 'TVS Apache', type: 'Bike', rate: 650, status: 'Available' },
        { vin: 'VIN4007', plate: 'HR26BK7777', name: 'RE Himalayan', type: 'Bike', rate: 1100, status: 'Available' }
      ],
      bookings: [
        { id: 1, customer: 'Ravi Sharma', vin: 'VIN1001', days: 3, tier: 'Regular', status: 'Completed', date: '2026-11-02' },
        { id: 2, customer: 'Asha Rawat', vin: 'VIN4002', days: 2, tier: 'Regular', status: 'Completed', date: '2026-11-04' },
        { id: 3, customer: 'Sana Khan', vin: 'VIN1002', days: 2, tier: 'Regular', status: 'Completed', date: '2026-11-08' },
        { id: 4, customer: 'Karan Mehta', vin: 'VIN3001', days: 1, tier: 'VIP', status: 'Confirmed', date: '2026-11-10' },

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var s = JSON.parse(raw); if (s && s.fleet && s.bookings) return s; }
    } catch (e) { /* storage blocked: fall through to sample data */ }
    return sample();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }

  var $ = function (s, r) { return (r || document).querySelector(s); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return 'Rs.' + Math.round(n).toLocaleString('en-IN'); }
  function fmtDate(iso) { var d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); }
  function shortDate(iso) { var d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }); }
  function vehicle(vin) { for (var i = 0; i < state.fleet.length; i++) if (state.fleet[i].vin === vin) return state.fleet[i]; return null; }
  function amountOf(b) { var v = vehicle(b.vin); return v ? v.rate * b.days : 0; }
  function stCls(s) { return s === 'Confirmed' ? 'p-info' : s === 'Pending' ? 'p-warn' : s === 'Completed' ? 'p-mute' : s === 'Available' ? 'p-ok' : 'p-info'; }
  function toast(msg, bad) {

    clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 3200);
  }

  // ---------- Dijkstra on the prototype's sample hub graph ----------
  function shortest(from, to) {
    var adj = {}, dist = {}, prev = {}, done = {};
    HUBS.forEach(function (h) { adj[h] = []; dist[h] = Infinity; });
    ROADS.forEach(function (r) { adj[r[0]].push({ to: r[1], km: r[2] }); if (r[3]) adj[r[1]].push({ to: r[0], km: r[2] }); });
    dist[from] = 0;
    for (var i = 0; i < HUBS.length; i++) {
      var u = null;
      HUBS.forEach(function (h) { if (!done[h] && (u === null || dist[h] < dist[u])) u = h; });
      if (u === null || dist[u] === Infinity) break;
      done[u] = true;
      adj[u].forEach(function (e) { if (dist[u] + e.km < dist[e.to]) { dist[e.to] = dist[u] + e.km; prev[e.to] = u; } });
    }
    if (dist[to] === Infinity) return null;
    var path = [];
    for (var at = to; at !== undefined; at = prev[at]) path.unshift(at);
    var legs = [];
    for (var k = 1; k < path.length; k++) legs.push(adj[path[k - 1]].filter(function (e) { return e.to === path[k]; })[0].km);
    return { km: dist[to], path: path, legs: legs };
  }

  // ---------- icons ----------

    car: '<path d="M3 13l2-5.5A2 2 0 0 1 6.9 6h10.2A2 2 0 0 1 19 7.5L21 13"/><rect x="3" y="13" width="18" height="5" rx="1.5"/><circle cx="7.5" cy="18" r="1.5"/><circle cx="16.5" cy="18" r="1.5"/>',

    cal: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',

  function routeResultHtml() {
    var r = shortest(ui.from, ui.to), rules = { oneway: 'One-way: Rs.200 base + Rs.12 per km.', peak: 'Peak season: the one-way charge x 1.25.', same: 'Same hub return: no drop-off charge.' };
    var used = {}, on = {};
    if (r) r.path.forEach(function (h, i) { on[h] = true; if (i) { used[r.path[i - 1] + '|' + h] = used[h + '|' + r.path[i - 1]] = true; } });
    var charge = !r ? 0 : ui.price === 'same' ? 0 : (200 + 12 * r.km) * (ui.price === 'peak' ? 1.25 : 1);
    var run = 0;
    var steps = r ? r.path.map(function (h, i) {
      if (i) run += r.legs[i - 1];
      var last = i === r.path.length - 1;
      return '<div class="step"><div class="step-l"><span class="dot' + (i === 0 || last ? ' end' : '') + '"></span><span class="stem"' + (last ? ' style="background:transparent"' : '') + '></span></div><div style="padding-bottom:16px;margin-top:-4px"><div style="font-weight:600">' + h + '</div><div class="muted" style="font-size:13px">' + (i === 0 ? 'Pickup · 0 km' : (last ? 'Drop-off · ' : '+' + r.legs[i - 1] + ' km · ') + run + ' km total') + '</div></div></div>';
    }).join('') : '';
    var ec = function (i) { return used[EDGES[i][0] + '|' + EDGES[i][1]] ? '#4d8dff' : 'transparent'; };
    var nf = function (h) { return on[h] ? '#4d8dff' : '#151a23'; };
    var N = { Mussoorie: [80,65], Dehradun: [150,130], Rishikesh: [95,215], Haridwar: [210,300], Chandigarh: [290,45], Ambala: [365,115], Saharanpur: [385,165], Roorkee: [290,225], Meerut: [440,167], Delhi: [500,170], Agra: [575,260], Jaipur: [575,80], Haldwani: [360,335], Nainital: [470,350] };
    var LP = { Mussoorie: [0,-16,'middle'], Dehradun: [-14,4,'end'], Rishikesh: [-14,4,'end'], Haridwar: [0,26,'middle'], Chandigarh: [0,-16,'middle'], Ambala: [-14,4,'end'], Saharanpur: [-12,24,'end'], Roorkee: [-14,4,'end'], Meerut: [0,32,'middle'], Delhi: [0,-16,'middle'], Agra: [0,26,'middle'], Jaipur: [0,-16,'middle'], Haldwani: [0,26,'middle'], Nainital: [0,26,'middle'] };
    var L = EDGES.map(function (e) { return [N[e[0]][0], N[e[0]][1], N[e[1]][0], N[e[1]][1]]; });
    var svg = '<svg viewBox="0 0 640 390" style="width:100%;height:auto;display:block" role="img" aria-label="' + (r ? 'Route: ' + r.path.join(', ') : 'No route') + '">' +
      '<g stroke="#2b3446" stroke-width="2" stroke-linecap="round">' + L.map(function (l) { return '<line x1="' + l[0] + '" y1="' + l[1] + '" x2="' + l[2] + '" y2="' + l[3] + '"/>'; }).join('') + '</g>' +
      '<g stroke-width="4" stroke-linecap="round">' + L.map(function (l, i) { return '<line x1="' + l[0] + '" y1="' + l[1] + '" x2="' + l[2] + '" y2="' + l[3] + '" stroke="' + ec(i) + '"/>'; }).join('') + '</g>' +
      '<g stroke="#6f80a6" stroke-width="2">' + HUBS.map(function (h) { return '<circle cx="' + N[h][0] + '" cy="' + N[h][1] + '" r="9" fill="' + nf(h) + '"/>'; }).join('') + '</g>' +
      '<g fill="#c9d1de" stroke="#12151b" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-size="12" font-weight="500" font-family="Inter,Segoe UI,sans-serif">' + HUBS.map(function (h) { return '<text x="' + (N[h][0] + LP[h][0]) + '" y="' + (N[h][1] + LP[h][1]) + '" text-anchor="' + LP[h][2] + '">' + h + '</text>'; }).join('') + '</g></svg>';
    return { rule: rules[ui.price], html:
      '<div class="grid-kpi" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">' +
        '<div class="card kpi"><div class="muted">Total distance</div><div class="kpi-val">' + (r ? r.km + ' km' : 'No route') + '</div></div>' +
        '<div class="card kpi"><div class="muted">Drop-off charge</div><div class="kpi-val">' + (r ? money(charge) : '-') + '</div></div>' +
        '<div class="card kpi"><div class="muted">Hubs on route</div><div class="kpi-val">' + (r ? r.path.length : 0) + '</div></div></div>' +
      '<div class="card pad"><div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px"><h2 style="font-size:16px;font-weight:600">Network map</h2><span class="muted small">Schematic, not to scale</span></div>' + svg + '</div>' +
      '<div class="card pad"><h2 style="font-size:16px;font-weight:600;margin-bottom:16px">Cheapest route</h2>' + steps + '</div>' +
      '<p class="muted small">Distances use the project\'s sample hub graph. The shortest path is calculated in this prototype with Dijkstra\'s algorithm; it is not computed by the C++ backend.</p>' };
  }

  // ---------- dialogs ----------

  function formError(m) { $('#dlg-err').textContent = m; }

  function submitVehicle() {
    var name = $('#nv-name').value.trim(), type = $('#nv-type').value, vin = $('#nv-vin').value.trim(), plate = $('#nv-plate').value.trim(), rateRaw = $('#nv-rate').value.trim();
    if (!name) return formError('Enter the vehicle name.');
    if (!vin) return formError('Enter the VIN.');
    if (!plate) return formError('Enter the registration number.');
    if (!/^\d+$/.test(rateRaw) || +rateRaw <= 0 || +rateRaw > 200000) return formError('Rate must be a whole number between 1 and 200000.');
    var dup = state.fleet.some(function (v) { return v.vin.toLowerCase() === vin.toLowerCase(); });
    if (dup) return formError('A vehicle with this VIN already exists.');
    var dupP = state.fleet.some(function (v) { return v.plate.toLowerCase() === plate.toLowerCase(); });
    if (dupP) return formError('A vehicle with this registration number already exists.');
    state.fleet.push({ vin: vin.toUpperCase(), plate: plate.toUpperCase(), name: name, type: type, rate: +rateRaw, status: 'Available' });
    save(); closeDialog(); toast('Vehicle ' + vin.toUpperCase() + ' added.'); render();
  }
  function submitBooking() {
    var cust = $('#nb-cust').value.trim(), vin = $('#nb-veh').value, daysRaw = $('#nb-days').value.trim(), tier = $('#nb-tier').value;
    if (!cust) return formError('Enter the customer name.');
    if (!/^\d+$/.test(daysRaw) || +daysRaw < 1 || +daysRaw > 365) return formError('Days must be a whole number between 1 and 365.');
    var v = vehicle(vin);
    if (!v || v.status !== 'Available') return formError('That vehicle is not available.');
    var id = state.nextId++;
    state.bookings.push({ id: id, customer: cust, vin: vin, days: +daysRaw, tier: tier, status: 'Pending', date: new Date().toISOString().slice(0, 10) });
    save(); closeDialog(); toast('Booking #' + id + ' created (pending).'); render();
  }

  // ---------- actions ----------
  function processNext() {
    var pend = state.bookings.filter(function (x) { return x.status === 'Pending'; }).sort(function (a, b) { return a.id - b.id; });
    if (!pend.length) return toast('No pending bookings.', true);
    var next = pend.filter(function (x) { return x.tier === 'VIP'; })[0] || pend[0];
    var v = vehicle(next.vin);
    if (!v || v.status !== 'Available') return toast('Booking #' + next.id + ': vehicle ' + next.vin + ' is not available.', true);
    next.status = 'Confirmed'; v.status = 'Booked'; state.undo.push(next.id);
    save(); toast('Confirmed booking #' + next.id + ' (' + next.tier + ').'); render();
  }
  function undoLast() {
    if (!state.undo.length) return toast('Nothing to undo.', true);
    var id = state.undo.pop(), b = state.bookings.filter(function (x) { return x.id === id; })[0];
    if (b && b.status === 'Confirmed') { b.status = 'Pending'; var v = vehicle(b.vin); if (v) v.status = 'Available'; toast('Undid booking #' + id + '. It is pending again.'); }
    else toast('That booking can no longer be undone.', true);
    save(); render();
  }
  function completeBooking(id) {
    var b = state.bookings.filter(function (x) { return x.id === id; })[0];
    if (!b || b.status !== 'Confirmed') return;
    b.status = 'Completed'; var v = vehicle(b.vin); if (v) v.status = 'Available';
    state.undo = state.undo.filter(function (x) { return x !== id; });
    save(); toast('Booking #' + id + ' completed. Vehicle is available again.'); render();
  }

  // ---------- render ----------
  function render() {
    var t = TITLES[ui.view];
    $('#title').textContent = t[0]; $('#subtitle').textContent = t[1];
    document.querySelectorAll('.nav-btn').forEach(function (b) {
      var on = b.getAttribute('data-nav') === ui.view; b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false');
    });
    $('#view').innerHTML = ui.view === 'dash' ? viewDash() : ui.view === 'fleet' ? viewFleet() : ui.view === 'book' ? viewBook() : viewRoute();
  }
  function refreshFleet() { var r = fleetRowsHtml(); $('#fleet-rows').innerHTML = r.html; $('#fleet-count').textContent = 'Showing ' + r.count + ' of ' + state.fleet.length + ' vehicles.'; }
  function refreshRoute() { var r = routeResultHtml(); $('#route-result').innerHTML = r.html; $('#price-rule').textContent = r.rule; document.querySelectorAll('[data-price]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-price') === ui.price); }); }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-nav],[data-act],[data-tab],[data-price]');
    if (!el) return;
    if (el.hasAttribute('data-nav')) { ui.view = el.getAttribute('data-nav'); render(); window.scrollTo(0, 0); return; }
    if (el.hasAttribute('data-tab')) { ui.tab = el.getAttribute('data-tab'); render(); return; }
    if (el.hasAttribute('data-price')) { ui.price = el.getAttribute('data-price'); refreshRoute(); return; }
    var act = el.getAttribute('data-act');
    if (act === 'add-vehicle') openVehicleForm();
    else if (act === 'new-booking') openBookingForm();
    else if (act === 'process') processNext();
    else if (act === 'undo') undoLast();
    else if (act === 'complete') completeBooking(+el.getAttribute('data-id'));
    else if (act === 'close') closeDialog();
    else if (act === 'swap') { var a = ui.from; ui.from = ui.to; ui.to = a; $('#rf').value = ui.from; $('#rt').value = ui.to; refreshRoute(); }
    else if (act === 'reset') { if (window.confirm('Reset all data to the original sample data?')) { state = sample(); save(); toast('Sample data restored.'); render(); } }
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'fq') { ui.q = e.target.value; refreshFleet(); } });
  document.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'ft') { ui.type = e.target.value; refreshFleet(); }
    else if (id === 'fa') { ui.avail = e.target.value; refreshFleet(); }
    else if (id === 'fs') { ui.sort = e.target.value; refreshFleet(); }
    else if (id === 'rf') { ui.from = e.target.value; refreshRoute(); }
    else if (id === 'rt') { ui.to = e.target.value; refreshRoute(); }
  });
  document.addEventListener('submit', function (e) {
    var kind = e.target.getAttribute('data-form');
    if (!kind) return;
    e.preventDefault();
    if (kind === 'vehicle') submitVehicle(); else if (kind === 'booking') submitBooking();
  });

  render();
})();
</script>
</body>
</html>
